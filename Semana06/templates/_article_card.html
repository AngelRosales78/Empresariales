{% load static %}

<div class="article-card">
    {% if article.featured_image %}
    <div class="article-card-image">
        <a href="{% url 'appnews:article_detail' article.slug %}">
            <img src="{{ article.featured_image.url }}" alt="{{ article.title }}">
        </a>
    </div>
    {% endif %}
    <div class="article-card-body">
        <div class="article-card-meta">
            {% if article.category %}
            <span class="article-category">
                <a href="{% url 'appnews:category_detail' article.category.slug %}">{{ article.category.name }}</a>
            </span>
            {% endif %}
            <span class="article-date">{{ article.published_at|date:"d M Y" }}</span>
        </div>
        <h2 class="article-card-title">
            <a href="{% url 'appnews:article_detail' article.slug %}">{{ article.title }}</a>
        </h2>
        <p class="article-card-summary">{{ article.summary|truncatewords:30|default:article.title }}</p>
        <div class="article-card-footer">
            <span class="article-author">Por {{ article.author.name }}</span>
            <a href="{% url 'appnews:article_detail' article.slug %}" class="read-more">Leer m&#225;s &rarr;</a>
        </div>
    </div>
</div>
