<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Library{% endblock %}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f5f5f5; color: #333; }
        .container { max-width: 900px; margin: 0 auto; padding: 20px; }
        header { background: #2c3e50; color: white; padding: 20px 0; margin-bottom: 30px; }
        header .container { padding: 0 20px; }
        h1 { font-size: 1.8em; }
        h2 { margin-bottom: 15px; color: #2c3e50; }
        h3 { margin-bottom: 10px; color: #34495e; }
        .book-list { list-style: none; }
        .book-item { background: white; margin-bottom: 15px; padding: 20px; border-radius: 5px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); display: flex; gap: 20px; }
        .book-item img { width: 100px; height: 150px; object-fit: cover; border-radius: 3px; background: #ecf0f1; }
        .book-item .info { flex: 1; }
        .book-item a { color: #2980b9; text-decoration: none; font-size: 1.2em; font-weight: bold; }
        .book-item a:hover { text-decoration: underline; }
        .meta { color: #7f8c8d; font-size: 0.9em; margin-top: 5px; }
        .tags { margin-top: 10px; }
        .tag { display: inline-block; background: #3498db; color: white; padding: 3px 10px; border-radius: 15px; font-size: 0.8em; margin-right: 5px; }
        .detail-card { background: white; padding: 30px; border-radius: 5px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .detail-header { border-bottom: 2px solid #ecf0f1; padding-bottom: 15px; margin-bottom: 20px; }
        .section { margin-bottom: 25px; }
        .section-title { font-size: 1.1em; color: #2c3e50; border-bottom: 1px solid #bdc3c7; padding-bottom: 5px; margin-bottom: 10px; }
        .info-grid { display: grid; grid-template-columns: 200px 1fr; gap: 8px; }
        .info-label { font-weight: bold; color: #7f8c8d; }
        .publications-table { width: 100%; border-collapse: collapse; }
        .publications-table th, .publications-table td { padding: 10px; text-align: left; border-bottom: 1px solid #ecf0f1; }
        .publications-table th { background: #ecf0f1; }
        .back-link { display: inline-block; margin-bottom: 20px; color: #2980b9; text-decoration: none; }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <h1>Library Management System</h1>
        </div>
    </header>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
